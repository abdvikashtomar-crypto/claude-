<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#a8412f"/>
  <!-- Embroidery hoop -->
  <circle cx="64" cy="64" r="40" fill="#fbf7f0"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#e9c9a0" stroke-width="7"/>
  <rect x="58" y="16" width="12" height="9" rx="3" fill="#e9c9a0"/>
  <!-- Three thread colour dots -->
  <circle cx="48" cy="56" r="11" fill="#c72b3b"/>
  <circle cx="74" cy="50" r="11" fill="#e8a33d"/>
  <circle cx="66" cy="76" r="11" fill="#2f6f8f"/>
  <!-- Needle with thread -->
  <g transform="rotate(-45 64 64)">
    <rect x="61.5" y="22" width="5" height="70" rx="2.5" fill="#2b2420"/>
    <ellipse cx="64" cy="30" rx="1.3" ry="4" fill="#fbf7f0"/>
  </g>
  <path d="M42 86 C 30 98, 52 104, 46 112" fill="none" stroke="#2b2420" stroke-width="3.5" stroke-linecap="round"/>
</svg>
